function render(){const x=data[selected];$('.phone').classList.toggle('dark',dark);$('.phone').style.setProperty('--glow',x.background[dark?'dark':'light']);$('.hero').innerHTML=svg(x);$('h2').textContent=x.title;$('.description').textContent=x.description;$('.material').textContent=x.material;renderGrid()}
$('.filters').innerHTML=['All',...new Set(data.map(x=>x.family))].map(f=>'<button aria-pressed="'+(f==='All')+'">'+f+'</button>').join('');document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{filter=b.textContent;document.querySelectorAll('.filters button').forEach(t=>t.setAttribute('aria-pressed',t===b));renderGrid()});$('#theme').onclick=()=>{dark=!dark;$('#theme').textContent=dark?'View light mode':'View dark mode';render()};$('#replay').onclick=render;$('.continue').onclick=()=>{selected=(selected+1)%data.length;render()};render();
</script></html>
