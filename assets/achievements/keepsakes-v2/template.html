<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Closer · A collection worth keeping</title><style>
*{box-sizing:border-box}body{margin:0;background:#eeeae3;color:#302820;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button{font:inherit;cursor:pointer}header{max-width:1250px;margin:55px auto 32px;padding:0 28px}h1{font-size:38px;letter-spacing:-1.4px;margin:8px 0 12px}p{line-height:1.5;color:#82776c}header p{max-width:570px}main{max-width:1250px;margin:auto;padding:0 28px 60px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:48px}.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}.filters button,.tools button{border:1px solid #cfc7be;background:transparent;border-radius:24px;padding:10px 15px;color:inherit}.filters button[aria-pressed=true]{background:#302820;color:white;border-color:#302820}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tile{border:1px solid transparent;background:#f8f5ef;border-radius:24px;min-height:210px;padding:16px 8px;color:inherit;transition:transform .2s,border-color .2s}.tile:hover{transform:translateY(-4px)}.tile[aria-pressed=true]{border-color:#796b58;background:#fffaf1}.tile img{object-fit:contain;width:100%;max-width:125px;height:145px;display:block;margin:auto;filter:drop-shadow(0 8px 5px #352b2425)}.tile strong{display:block;font-size:14px;font-weight:600}.tile small{display:block;font-size:11px;color:#8b7a66;margin-top:5px}.tile .shine{display:none}.preview{position:sticky;top:24px;align-self:start}.phone{--glow:#eed2ab;position:relative;overflow:hidden;border:7px solid #38352f;border-radius:54px;height:745px;background:radial-gradient(ellipse at 50% 28%,var(--glow),transparent 65%),#fffaf2;box-shadow:0 24px 50px #35271624;display:flex;align-items:center;flex-direction:column;padding:64px 25px 28px;text-align:center;transition:background-color .35s,color .35s}.phone:before{content:'';position:absolute;top:13px;width:108px;height:28px;background:#181918;border-radius:30px}.phone.dark{background:radial-gradient(ellipse at 50% 28%,var(--glow),transparent 66%),#111913;color:#fcf5e9}.eyebrow{font-size:14px;font-weight:600;color:#897866;margin:12px 0 4px}.dark .eyebrow{color:#c3c5b8}.hero{width:300px;height:300px;margin:6px -20px 0;filter:drop-shadow(0 19px 13px #24191435);perspective:800px}.hero img{width:100%;height:100%;object-fit:contain;overflow:visible;animation:arrive .8s cubic-bezier(.2,.8,.2,1) both}.hero .shine{animation:sheen 4.8s ease-in-out infinite;animation-delay:1s}.phone h2{font-size:31px;line-height:1.08;letter-spacing:-1px;margin:11px 0 10px}.description{font-size:16px;min-height:48px;max-width:285px;margin:0;color:#827363}.dark .description{color:#c0c8bf}.material{font-size:12px;color:#887768;margin-top:20px}.dark .material{color:#bec7bb}.continue{margin-top:auto;background:#30251c;border:none;color:#fffaf2;border-radius:30px;min-height:52px;width:100%;font-weight:600}.dark .continue{background:#fffaf2;color:#30251c}.tools{display:flex;justify-content:center;gap:8px;margin-top:16px}.note{font-size:12px;text-align:center}.hero .symbol{animation:detail .8s .13s both}.hero .ribbon{animation:detail .8s .2s both;transform-origin:50% 65%}.empty{padding:30px}.count{font-size:13px;color:#827363;margin-bottom:16px}@keyframes arrive{from{transform:translateY(55px) scale(.76) rotate(-8deg);opacity:0}70%{transform:translateY(-5px) scale(1.03) rotate(1deg)}to{transform:none;opacity:1}}@keyframes detail{from{opacity:0}to{opacity:1}}@keyframes sheen{0%,12%{transform:translateX(-140px);opacity:0}18%{opacity:.65}36%{transform:translateX(380px);opacity:0}100%{transform:translateX(380px);opacity:0}}@media(max-width:700px){main{grid-template-columns:1fr}.preview{position:static;grid-row:1;max-width:390px;width:100%;margin:auto}header{margin-top:25px}h1{font-size:30px}.grid{grid-template-columns:repeat(3,1fr)}}@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}
</style><header><span>Closer · Keepsakes, volume two</span><h1>Small treasures. Real stories.</h1><p>Six sculpted keepsakes. Each one tells its own story through its shape, texture, and light.</p></header><main><section><nav class="filters" aria-label="Badge families"></nav><div class="count"></div><div class="grid"></div></section><aside class="preview"><div class="phone"><div class="eyebrow">Achievement unlocked</div><div class="hero"></div><h2></h2><p class="description"></p><p class="material"></p><button class="continue">Continue</button></div><div class="tools"><button id="theme">View dark mode</button><button id="replay">Replay reveal</button></div><p class="note">Art direction preview · Not yet added to the app.</p></aside></main><script>
const data=/* COLLECTION_DATA */;let selected=0,filter='All',dark=false,serial=0;const $=s=>document.querySelector(s);const copy={'Daily letters':'A little room for God. A beginning worth keeping.','Streaks':'You kept showing up. Every small step matters.','Reading':'One page closer. A story you carry with you.','Bible Moments':'A moment discovered. A truth worth keeping.','Prayer and questions':'A quiet moment. A deeper connection.'};function oldSvg(x){const prefix='badge'+(++serial)+'-';return x.svg.replace(/id="([^"]+)"/g,(_,s)=>'id="'+prefix+s+'"').replace(/url\(#([^)]+)\)/g,(_,s)=>'url(#'+prefix+s+')').replace('aria-labelledby="title"','aria-labelledby="'+prefix+'title"')}
function svg(x){return '<img src="'+x.image+'" alt="'+x.title+' keepsake" draggable="false">'}
function renderGrid(){const items=data.filter(x=>filter==='All'||x.family===filter);$('.count').textContent=items.length+' keepsakes';$('.grid').innerHTML=items.map(x=>'<button class="tile" data-id="'+x.id+'" aria-pressed="'+(data[selected].id===x.id)+'">'+svg(x)+'<strong>'+x.title+'</strong>'+(x.id==='listener'?'<small>Future recording milestone</small>':'')+'</button>').join('');document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{selected=data.findIndex(x=>x.id===b.dataset.id);render()})}
function render(){const x=data[selected];$('.phone').classList.toggle('dark',dark);$('.phone').style.setProperty('--glow',x.background[dark?'dark':'light']);$('.hero').innerHTML=svg(x);$('h2').textContent=x.title;$('.description').textContent=x.description;$('.material').textContent=x.material;renderGrid()}
$('.filters').innerHTML=['All',...new Set(data.map(x=>x.family))].map(f=>'<button aria-pressed="'+(f==='All')+'">'+f+'</button>').join('');document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{filter=b.textContent;document.querySelectorAll('.filters button').forEach(t=>t.setAttribute('aria-pressed',t===b));renderGrid()});$('#theme').onclick=()=>{dark=!dark;$('#theme').textContent=dark?'View light mode':'View dark mode';render()};$('#replay').onclick=render;$('.continue').onclick=()=>{selected=(selected+1)%data.length;render()};render();
</script></html>
