function renderGrid(){const items=data.filter(x=>filter==='All'||x.family===filter);$('.count').textContent=items.length+' badges';$('.grid').innerHTML=items.map(x=>'<button class="tile" data-id="'+x.id+'" aria-pressed="'+(data[selected].id===x.id)+'">'+svg(x)+'<strong>'+x.title+'</strong>'+(x.id==='listener'?'<small>Future recording milestone</small>':'')+'</button>').join('');document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{selected=data.findIndex(x=>x.id===b.dataset.id);render()})}
function render(){const x=data[selected];$('.phone').classList.toggle('dark',dark);$('.phone').style.setProperty('--glow',x.background[dark?'dark':'light']);$('.hero').innerHTML=svg(x);$('h2').textContent=x.title;$('.description').textContent=copy[x.family];$('.material').textContent=x.material;renderGrid()}
$('.filters').innerHTML=['All',...new Set(data.map(x=>x.family))].map(f=>'<button aria-pressed="'+(f==='All')+'">'+f+'</button>').join('');document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{filter=b.textContent;document.querySelectorAll('.filters button').forEach(t=>t.setAttribute('aria-pressed',t===b));renderGrid()});$('#theme').onclick=()=>{dark=!dark;$('#theme').textContent=dark?'View light mode':'View dark mode';render()};$('#replay').onclick=render;$('.continue').onclick=()=>{selected=(selected+1)%data.length;render()};render();
</script></html>
