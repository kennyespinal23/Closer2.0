<style>
@font-face{font-family:Nunito;src:url('../../assets/fonts/nunito/nunito-500.ttf');font-weight:500}@font-face{font-family:Nunito;src:url('../../assets/fonts/nunito/nunito-800.ttf');font-weight:800}@font-face{font-family:Nunito;src:url('../../assets/fonts/nunito/nunito-900.ttf');font-weight:900}*{box-sizing:border-box}body{margin:0;background:#eee9e1;color:#241b16;font-family:Nunito,sans-serif;font-weight:500}button,textarea{font:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible{outline:3px solid #d27523;outline-offset:3px}header{padding:28px 4vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #d7cfc3}.brand{font-size:26px;font-weight:900;letter-spacing:-1px}.tag{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:#78695b}main{max-width:1390px;margin:32px auto;display:grid;grid-template-columns:260px 410px 285px;gap:50px;justify-content:center;padding:0 24px}h1{font-size:36px;line-height:1.1;letter-spacing:-1px;margin:12px 0 24px;font-weight:900}nav{display:grid;gap:4px}nav button{border:0;background:transparent;text-align:left;padding:12px 14px;border-radius:14px;color:#6e6054;display:flex;gap:14px;align-items:center;font-size:14px;font-weight:800}nav button[aria-pressed=true]{background:#30231b;color:#fff5e5}nav span{font-size:11px;opacity:.6}aside{padding-top:40px}aside h2{font-size:25px;line-height:1.2;letter-spacing:-.5px}aside p{font-size:16px;line-height:1.65;color:#766759}aside .rule{padding:18px 0;border-top:1px solid #d4c9bb}.rule b{display:block;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:6px}.phone{height:810px;border:7px solid #27221f;border-radius:50px;background:var(--bg);color:var(--ink);box-shadow:0 24px 60px #38230e25;overflow:hidden;position:relative;display:flex;flex-direction:column;--bg:#fff7ea;--ink:#30231b;--muted:#806b58;--accent:#ffbb3b}.status{height:42px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:9px 25px;font-size:12px;font-weight:900}.island{width:104px;height:25px;background:#17120f;border-radius:20px}.top{display:flex;align-items:center;gap:14px;padding:6px 20px 16px}.icon{border:0;border-radius:50%;height:40px;width:40px;background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink);font-size:21px}.bars{display:flex;flex:1;gap:5px}.bars i{height:4px;background:color-mix(in srgb,var(--ink) 17%,transparent);border-radius:4px;flex:1}.bars i.on{background:var(--accent)}.content{overflow:auto;flex:1;padding:0 24px 24px;scrollbar-width:none}.content h2{font-size:34px;line-height:1.14;font-weight:900;letter-spacing:-.8px;margin:10px 0 16px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:8px 0}.sub{font-size:16px;line-height:1.5;color:var(--muted);margin:0 0 20px}.art{height:260px;overflow:hidden;border-radius:23px;position:relative;margin:14px 0 24px}.art img{width:100%;height:100%;object-fit:cover}.art:after{content:'';position:absolute;inset:40% 0 0;background:linear-gradient(transparent,#1e110e9c)}.art .caption{position:absolute;bottom:18px;left:18px;right:18px;color:#fff5e4;z-index:1;font-size:22px;font-weight:900}.footer{padding:14px 24px 24px;background:var(--bg)}.cta{height:54px;border-radius:28px;border:0;background:var(--ink);color:var(--bg);font-weight:900;font-size:16px;width:100%}.footer small{display:block;text-align:center;font-size:11px;color:var(--muted);margin-bottom:10px}.homebar{width:115px;height:4px;border-radius:5px;background:var(--ink);opacity:.7;margin:0 auto 8px}.paper{padding:25px;background:#fff8ea;color:#35261c;border-radius:18px;box-shadow:0 9px 22px #00000012;line-height:1.7;font-size:19px}.paper p{margin:0 0 18px}.paper p:last-child{margin:0}.quote{font-size:30px;line-height:1.42;font-weight:800;letter-spacing:-.5px;margin:38px 0 20px}.ref{font-size:12px;letter-spacing:1px;color:var(--muted)}.choices{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0}.chip{border:1px solid color-mix(in srgb,var(--ink) 18%,transparent);background:transparent;color:var(--ink);border-radius:24px;padding:12px 16px;font-size:15px;font-weight:800;min-height:44px}.chip.selected{background:var(--ink);color:var(--bg)}.reveal{border:1px solid #cdbda755;background:color-mix(in srgb,var(--ink) 5%,var(--bg));border-radius:20px;padding:22px;font-size:18px;line-height:1.55}.reveal b{display:block;margin-bottom:8px}.envelope{margin:40px auto 32px;height:170px;background:#f3dfc1;border-radius:12px;position:relative;transform:rotate(-5deg);box-shadow:0 16px 30px #0003}.envelope:before{content:'';position:absolute;inset:0;background:#e9cb9e;clip-path:polygon(0 0,100% 0,50% 65%)}.seal{position:absolute;left:calc(50% - 23px);top:65px;width:46px;height:46px;border-radius:50%;background:#f44723;color:#fff;text-align:center;line-height:46px;font-size:26px}.unfold{animation:unfold .65s cubic-bezier(.2,.8,.2,1)}@keyframes unfold{from{opacity:0;transform:translateY(30px) rotate(-3deg)}to{opacity:1;transform:none}}.scene{animation:arrive .28s ease-out}@keyframes arrive{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}.verse button{border:0;background:transparent;color:var(--ink);font:inherit;text-align:left;padding:2px 4px;border-bottom:2px solid #e9bc5c}.verse button.selected{background:#ffe1a0;border-radius:6px}.timeline{display:flex;margin:15px 0 24px;gap:6px}.timeline button{flex:1;border:0;border-top:3px solid #bdb09c;background:transparent;padding:10px 0;color:var(--muted);font-weight:800}.timeline button.selected{border-color:var(--accent);color:var(--ink)}textarea{width:100%;height:150px;border:1px solid #bba88d66;border-radius:20px;background:color-mix(in srgb,var(--bg) 96%,var(--ink));padding:18px;color:var(--ink);font-size:18px;resize:vertical;line-height:1.5}.breath{width:150px;height:150px;margin:34px auto;border-radius:50%;background:#f1dfb8;box-shadow:0 0 0 25px #f1dfb80a,0 0 0 50px #f1dfb806;animation:breathe 8s ease-in-out infinite}@keyframes breathe{50%{transform:scale(1.12);box-shadow:0 0 0 30px #f1dfb812,0 0 0 60px #f1dfb805}}details{border-bottom:1px solid #bba88d55;padding:17px 0}summary{font-size:18px;font-weight:800;cursor:pointer}details p{line-height:1.6;color:var(--muted)}.complete{text-align:center;padding-top:65px}.complete .mark{margin:auto auto 28px;border-radius:50%;background:var(--accent);color:#30231b;width:72px;height:72px;font-size:36px;display:grid;place-items:center}.note{font-size:12px;line-height:1.6;color:#8c7d70;margin-top:24px}.tiny{font-size:12px;color:var(--muted)}@media(max-width:1100px){main{grid-template-columns:220px 390px;gap:25px}aside{grid-column:1/-1;padding:0;max-width:650px}}@media(max-width:680px){header{padding:18px}header .tag{display:none}main{display:flex;flex-direction:column;padding:0 12px;margin:18px auto;gap:20px}.intro h1{font-size:26px;margin:8px 0 16px}nav{display:flex;overflow:auto;padding-bottom:8px}nav button{min-width:150px}aside{padding:0 14px}.phone{width:100%;max-width:410px;align-self:center;height:800px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style><link rel="stylesheet" href="interactive.css">
<header><div class="brand">closer<span style="color:#d1642b">.</span></div><div class="tag">Experience studies / 01 — Devotionals</div><button class="chip" id="theme" style="color:#30231b">Switch theme</button></header><main><section class="intro"><div class="tag">One rhythm. Ten voices.</div><h1>Different ways<br>to draw near.</h1><nav id="nav" aria-label="Devotional categories"></nav><p class="note">Interactive design proposal.<br>Sample copy, not the live app.<br>Your reflections stay in this page only.</p></section><section class="phone" aria-label="Interactive phone preview"><div class="status"><span>9:41</span><div class="island"></div><span>••• ▰</span></div><div class="top"><button class="icon" id="back" aria-label="Back one step">‹</button><div class="bars" id="bars"></div><button class="icon" id="reset" aria-label="Restart this experience">↻</button></div><div class="content" id="screen"></div><div class="footer"><small id="stepLabel"></small><button class="cta" id="next"></button></div><div class="homebar"></div></section><aside id="notes"></aside></main>
<script>
const A='../../assets/sermon-types/illustrations/';
const types=[
 {name:'Daily Church',title:'Faith for an ordinary Tuesday.',art:'cross-mountain.jpg',tone:'A small Sunday, in your pocket.',pattern:'Teach → understand → practice',why:'A familiar daily anchor. One teaching, one Scripture connection, one thing to carry into the day.',motion:'The teaching arrives in short chapters. A single highlight follows the idea; no timed reading.',action:'Open the teaching',reflection:'What is one small act of faith you can practice today?'},
 {name:'Jesus Only',title:'Stay with His words.',art:'hands-sun.jpg',tone:'Quiet enough to pay attention.',pattern:'Read → stay → return',why:'Strip away commentary and quizzes. Let the words of Jesus be the whole experience, with an optional moment of stillness.',motion:'Soft fades and generous pauses. Nothing advances until you choose.',action:'Be still',reflection:'Carry these words with you. There is nothing to fill in.'},
 {name:'Letters From A Struggling Christian',short:'Letters · Struggling',title:'I don’t know how to pray anymore.',art:'boat-ocean.jpg',tone:'An honest voice beside you.',pattern:'Open → recognize → respond',why:'Private, unpolished, and gentle. Offer recognition instead of testing someone when they already feel worn down.',motion:'The envelope opens once, then becomes a steady reading surface. No repeated entrance theatrics.',action:'Open the letter',reflection:'What would you like to say to God, exactly as you are?'},
 {name:'Letters From A Grateful Christian',short:'Letters · Grateful',title:'The small things were not small.',art:'heart-flower.jpg',tone:'A thank-you note, passed on.',pattern:'Open → notice → give thanks',why:'Use the same letter family, but invite the reader to name something good. Gratitude becomes a response, not a score.',motion:'A warm paper reveal. Your thank-you becomes a small note at the end.',action:'Open the thank-you',reflection:'Name one ordinary thing you are grateful for today.'},
 {name:'Character Studies',title:'Peter. The courage to begin again.',art:'peter-the-one-who-failed-out-loud.jpeg',tone:'A person before a lesson.',pattern:'Meet → follow → reflect',why:'Follow a person through turning points, with Scripture references always visible. Separate reflection from the biblical account.',motion:'Tap through three scenes. The artwork stays anchored while the story changes.',action:'Meet Peter',reflection:'Where do you need the courage to begin again?'},
 {name:'Deep Verse Studies',title:'One verse. More to discover.',art:'open-book.jpg',tone:'Slow down inside the words.',pattern:'Read → explore → hold close',why:'Make the verse itself the interface. Tap phrases to reveal context without losing your place or opening another page.',motion:'A phrase highlights in place; its explanation appears beneath it. No moving text while reading.',action:'Open the verse',reflection:'Which phrase would you like to carry into today?'},
 {name:'Misconceptions',title:'Do I have to earn God’s love?',art:'lightbulb.jpg',tone:'Make room for a truer thought.',pattern:'Notice → compare → reframe',why:'Show the familiar belief, then place Scripture beside it. Invite reconsideration without a shaming right-or-wrong game.',motion:'An intentional reveal replaces the belief with the Scripture response. The reader controls the reveal.',action:'Look closer',reflection:'How would your day change if love came before performance?'},
 {name:'Testimonies',title:'A story worth listening to.',art:'chapel-hill.jpg',tone:'Someone else’s ordinary miracle.',pattern:'Listen or read → witness → reflect',why:'Put the actual storyteller first: their name, their words, and an approved video or transcript. Never invent a real person’s testimony.',motion:'A quiet chapter timeline, optional captions, and a transcript that does not compete with playback.',action:'Explore the story format',reflection:'What part of someone’s story helps you feel less alone?'},
 {name:'Questions People Are Afraid To Ask',short:'Honest Questions',title:'Can I believe and still have doubts?',art:'doorway-path.jpg',tone:'You can ask that here.',pattern:'Ask → explore → keep asking',why:'Use an open conversation with optional follow-up questions. Acknowledge complexity, and do not score someone’s faith.',motion:'Answers expand where they are asked. Keep the question visible so the response feels connected.',action:'Explore the question',reflection:'What question would you like to keep exploring?'},
 {name:'Prayer Nights',title:'You can lay today down.',art:'moon-stars.jpg',tone:'Less to do. More room to rest.',pattern:'Arrive → pray → rest',why:'A gentle evening ending. Pick what you are carrying, pray, and leave with a quiet completion instead of a quiz.',motion:'Optional slow breathing motion. No countdown, urgency, or confetti; Reduce Motion keeps the moon still.',action:'Settle in',reflection:'Father, I give this day back to You. Hold what I cannot carry tonight. Amen.'}
];
let index=0,step=0,dark=false,choice='',scene=0,flipped=false,notes={};const $=s=>document.querySelector(s);const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function select(i){index=i;step=0;choice='';scene=0;flipped=false;render()}
function chip(label){return `<button class="chip ${choice===label?'selected':''}" data-choice="${label}">${label}</button>`}
function intro(t){return `<div class="eyebrow">${t.short||t.name}</div><h2>${t.title}</h2><p class="sub">${t.tone}</p><div class="art"><img src="${A+t.art}" alt="${t.name} illustration"><div class="caption">${t.pattern.split(' → ')[0]} with intention.</div></div><p class="sub">${t.pattern}</p>`}
function experience(t){let head=`<div class="eyebrow">${t.short||t.name}</div>`;switch(index){
case 0:return head+`<h2>Faithfulness starts small.</h2><div class="paper"><p>You do not need an extraordinary day to practice love. Begin with the person already in front of you.</p><p>Let today’s teaching become one ordinary action.</p></div><p class="ref">Reflection on Luke 16:10</p><div class="choices">${['Listen fully','Offer help','Make time'].map(chip).join('')}</div>`;
case 1:return head+`<div class="breath" style="width:60px;height:60px;background:#edb855;animation:none;margin:55px auto"></div><div class="quote">“Come unto me, all ye that labour and are heavy laden, and I will give you rest.”</div><div class="ref">Matthew 11:28 · KJV</div><p class="sub" style="margin-top:30px">Read it once more.<br>Stay as long as you need.</p>`;
case 2:return head+`<div class="envelope"><span class="seal">✝</span></div><div class="paper unfold"><p>Dear friend,</p><p>Today my prayer was a sigh. I wanted better words, but these were the only ones I had.</p><p>I’m learning that I can begin there. Maybe you can, too.</p><p>Someone still learning</p></div><p class="tiny">Illustrative letter · not a submitted testimony</p>`;
case 3:return head+`<h2>Dear God,<br>thank You for the ordinary.</h2><div class="paper unfold"><p>The meal. The call I almost didn’t answer. The friend who stayed a little longer.</p><p>I kept looking for something big. Today I noticed what was already here.</p></div><p class="tiny">Illustrative thank-you letter</p><div class="choices">${['A person','A moment','A new beginning'].map(chip).join('')}</div>`;
case 4:let scenes=[['The calling','Jesus calls Peter to follow Him. A working fisherman steps into a new story.','Luke 5:1–11'],['The failure','Peter denies knowing Jesus three times. The story does not hide his failure.','Luke 22:54–62'],['The restoration','Jesus asks Peter about his love and entrusts him with caring for His sheep.','John 21:15–19']];return head+`<div class="art" style="height:220px"><img src="${A+t.art}" alt="Illustration for Peter’s story"></div><div class="timeline">${scenes.map((s,i)=>`<button data-scene="${i}" class="${scene===i?'selected':''}">${i+1}. ${s[0].split(' ')[1]}</button>`).join('')}</div><h2>${scenes[scene][0]}</h2><p class="sub">${scenes[scene][1]}</p><p class="ref">${scenes[scene][2]} · Account summary</p>`;
case 5:return head+`<h2>What does rest mean here?</h2><div class="quote verse">${['The LORD','is my shepherd;','I shall not want.'].map(x=>`<button data-choice="${x}" class="${choice===x?'selected':''}">${x}</button>`).join(' ')}</div><p class="ref">Psalm 23:1 · KJV</p><div class="reveal"><b>${choice||'Touch a phrase'}</b>${({'The LORD':'The psalm begins with who God is, before describing what He provides.','is my shepherd;':'David uses the image of a shepherd: personal guidance, care, and protection.','I shall not want.':'Here “want” means lack. Read the rest of the psalm to see how care and difficult valleys coexist.'})[choice]||'Explore the meaning without leaving the verse.'}</div>`;
case 6:return head+`<h2>Love comes first.</h2><div class="reveal" style="margin-top:35px"><div class="eyebrow">${flipped?'A Scripture response':'The belief'}</div><div class="quote" style="margin:12px 0">${flipped?'“We love him, because he first loved us.”':'“If I do enough, God will finally love me.”'}</div>${flipped?'<p class="ref">1 John 4:19 · KJV</p>':''}</div><button id="flip" class="chip" style="width:100%;margin-top:20px">${flipped?'See the belief again':'Place it beside Scripture'}</button>`;
case 7:return head+`<div class="art"><img src="${A+t.art}" alt="Testimony cover placeholder"><div class="caption">Their voice. Their story.</div></div><h2>A life, in three chapters.</h2><p class="tiny">Format preview · no testimony or video supplied</p><div class="timeline">${['Before','Turning point','Today'].map((x,i)=>`<button data-scene="${i}" class="${scene===i?'selected':''}">${x}</button>`).join('')}</div><div class="reveal">${['Open with the person’s own account of what life felt like before.','Let them describe the moment something changed, without embellishing their story.','Show what life looks like now, including what remains unresolved.'][scene]}</div><details><summary>Transcript placement</summary><p>The approved speaker transcript belongs here. Keep captions and reading available alongside the real video.</p></details>`;
case 8:return head+`<h2>Can I believe and still have doubts?</h2><div class="paper">In Mark 9:24, a father brings both belief and unbelief to Jesus. The passage makes room for an honest request for help.</div>${[['Does doubt mean I have failed?','That father’s words are a starting point for bringing uncertainty into prayer, rather than hiding it.'],['What can I do with this question?','Read Mark 9:14–29 in context. Write down what troubles you and talk with someone you trust.'],['Do I need an answer right now?','You can leave with a question still open. This experience should offer room to return.']].map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('')}`;
case 9:return head+`<h2>What are you carrying tonight?</h2><div class="breath"></div><p class="sub" style="text-align:center">Take a comfortable breath.<br>There is no pace to keep.</p><div class="choices" style="justify-content:center">${['Worry','Gratitude','Weariness','Hope'].map(chip).join('')}</div>`;
}}
function respond(t){return `<div class="eyebrow">${index===9?'A prayer for tonight':'Make room for a response'}</div><h2>${index===1?'Let it stay with you.':index===9?'Lay today down.':'One thing to carry.'}</h2>${index===9?'<div class="breath" style="width:80px;height:80px"></div>':''}<p class="${index===9?'quote':'sub'}">${t.reflection}</p>${[1,9].includes(index)?'':`<textarea id="reflection" aria-label="Your reflection" placeholder="A few words, if you’d like…">${esc(notes[index]||'')}</textarea><p class="tiny">Optional · only kept while this preview is open</p>`}`}
function render(){const t=types[index],night=dark||index===9;$('.phone').style.cssText=`--bg:${night?'#241b1c':'#fff7ea'};--ink:${night?'#fff2df':'#30231b'};--muted:${night?'#c6b2a7':'#806b58'};--accent:#ffbb3b`;$('#nav').innerHTML=types.map((t,i)=>`<button data-type="${i}" aria-pressed="${i===index}"><span>${String(i+1).padStart(2,'0')}</span>${t.short||t.name}</button>`).join('');$('#bars').innerHTML=[0,1,2].map(i=>`<i class="${i<=step?'on':''}"></i>`).join('');$('#screen').innerHTML=`<div class="scene">${step===0?intro(t):step===1?experience(t):step===2?respond(t):`<div class="complete"><div class="mark">✓</div><div class="eyebrow">${t.short||t.name}</div><h2>${index===9?'Rest well.':'A moment, kept.'}</h2><p class="sub">${notes[index]?esc(notes[index]):index===1?'Return to His words whenever you need.':'Take this with you into what comes next.'}</p></div>`}</div>`;$('#screen').scrollTop=0;$('#next').textContent=step===0?t.action:step===1?(index===9?'Begin my prayer':index===1?'Carry these words':'Continue'):step===2?(index===9?'Amen':index===1?'Return to today':'Keep this moment'):'Explore another category';$('#stepLabel').textContent=step<3?`${step+1} of 3 · ${t.pattern.split(' → ')[step]}`:'Preview complete';$('#notes').innerHTML=`<div class="tag">The design decision</div><h2>${t.tone}</h2><p>${t.why}</p><div class="rule"><b>The rhythm</b>${t.pattern}</div><div class="rule"><b>Motion</b><p>${t.motion}</p></div><div class="rule"><b>What stays familiar</b><p>Nunito hierarchy. Rounded actions. A three-part progress bar. A clear way back. No forced writing or timed reading.</p></div>`;$('#back').disabled=step===0;document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>select(+b.dataset.type));document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{choice=b.dataset.choice;render()});document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{scene=+b.dataset.scene;render()});if($('#flip'))$('#flip').onclick=()=>{flipped=!flipped;render()};if($('#reflection'))$('#reflection').oninput=e=>notes[index]=e.target.value}
$('#next').onclick=()=>{if(step===3)select((index+1)%10);else{step++;render()}};$('#back').onclick=()=>{step=Math.max(0,step-1);render()};$('#reset').onclick=()=>select(index);$('#theme').onclick=()=>{dark=!dark;render()};render();
</script><script src="interactive.js"></script></html>
