<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Closer category folds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="file:///Users/kennyespinal23/.claude/skills/app-designer-pro/assets/device.css">
<style>
.screen { font-family: "Nunito", var(--sf-rounded); background: #211D19; color: #F7F0E6; }
.board { position: absolute; inset: 0; padding: 30px 20px 0; display: flex; flex-direction: column; gap: 10px; }
.board h2 { margin: 0; font-size: 26px; line-height: 30px; font-weight: 900; letter-spacing: -.6px; }
.board .what { margin: 0 0 6px; font-size: 15px; line-height: 21px; font-weight: 600; color: #BBAA99; }
.cap { font-size: 13px; line-height: 17px; font-weight: 800; letter-spacing: .4px; color: #A8978A; margin-top: 6px; }
.card { position: relative; flex: none; width: 362px; border-radius: 28px; overflow: hidden; }
.ground, .art { position: absolute; inset: 0; }
.art > * { position: absolute; }
.l { position: absolute; left: 22px; }
.num { font-size: 30px; line-height: 32px; font-weight: 800; font-variant-numeric: tabular-nums; }
.lab { font-size: 15px; line-height: 20px; font-weight: 800; margin-top: 2px; white-space: nowrap; }
.kick { top: 20px; display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 17px; font-weight: 800; }
.kick .dots { display: flex; gap: 4px; }
.kick .dots i { width: 7px; height: 7px; border-radius: 4px; border: 1.5px solid currentColor; box-sizing: border-box; }
.kick .dots i.on { background: currentColor; }
.title { width: 240px; font-size: 26px; line-height: 28px; font-weight: 800; letter-spacing: -.5px; transform-origin: left top; }
.title span { display: inline; }
.steps { top: 166px; display: flex; align-items: center; gap: 6px; }
.tok { width: 36px; height: 36px; border-radius: 18px; display: grid; place-items: center; box-shadow: 0 2px 6px #0000001F; }
.steps .k { font-size: 15px; font-weight: 800; margin-left: 6px; }
</style>
</head>
<body>

<script>
/* The ten categories, with the day each one falls on and the production theme (components/CategoryArt.tsx). */
const T = (ground, light, label, accent, accentInk, ink) => ({ ground, light, label, accent, accentInk, ink: ink ?? (light ? "#2A1206" : "#FFFFFF"), num: light ? "#2A120680" : "#FFFFFF8C", chip: light ? "#2A1206E0" : "#FFFFFFEB", chipIcon: light ? "#FFF6E6" : "#2A1206" });
const CATS = [
  { id: "daily-church", day: 1, label: "Daily Church", ref: "Genesis 1:27", title: "Made in His Image", name: "The sun sets", what: "Folding, the sun sinks below the card's edge and the ground turns to dusk. Settled open, it rises the last stretch.",
    theme: T(["#FFE45C", "#FFC21A", "#FF9F0A"], true, "#8A3B00", "#FFC21A", "#2A1206", "#3A1500") },
  { id: "jesus-only", day: 2, label: "Jesus Only", ref: "Genesis 2:15–17", title: "One Rule, Everywhere Else Free", name: "Into the full stop", what: "“Him” folds into its gold full stop, which stays as the slim card's mark. Settled open, the stop lands with a small bounce.",
    theme: T(["#FF5A4E", "#E0233A", "#A80F2A"], false, "#FFE27A", "#FF4B55", "#FFFFFF") },
  { id: "letters-struggling", day: 3, label: "A struggling letter", ref: "Genesis 2:23", title: "Bone of My Bones", name: "The weight", what: "Folding, the quote mark sinks and leans as if weighed down. Opening lifts it; settled, it rises a little and lets go.",
    theme: T(["#2BD58C", "#13A06A", "#0A6B47"], false, "#FFE0C9", "#2BD58C", "#06301F") },
  { id: "letters-grateful", day: 4, label: "A grateful letter", ref: "Genesis 3:1", title: "The Conversation That Broke Everything", name: "The closing quote", what: "The big quote mark flies down and closes the title, so the slim card reads as a quotation. Settled open, it springs back.",
    theme: T(["#FFB3C6", "#FF7A9E", "#F24F7F"], true, "#6E0B2C", "#FF7A9E", "#3A0716", "#3A0716") },
  { id: "character-studies", day: 5, label: "Character study", ref: "Genesis 3:9", title: "Where Are You?", name: "Name to initial", what: "The name slides into its first letter, which becomes a monogram. Settled open, the rest of the name types back out.",
    theme: T(["#FFB15C", "#FF7A1A", "#E2500A"], false, "#FFF1E0", "#FF8A2B", "#2A1000"), who: "ADAM" },
  { id: "deep-verse", day: 6, label: "Deep verse", ref: "Genesis 3:15", title: "The First Promise", name: "The lens", what: "The verse fades and the lens zooms in on its key word, which the slim card keeps. Settled open, the lens reads across to the word.",
    theme: T(["#3A2E44", "#231B2A", "#18121C"], false, "#FFC21A", "#FFC21A", "#2A1206"), verse: "And I will put enmity between you and the woman", word: "enmity" },
  { id: "misconceptions", day: 7, label: "Misconception", ref: "Genesis 3:21", title: "Clothed and Sent Out", name: "The strike wins", what: "Folding, the lie fades and only the red strike is left. Settled open, the strike draws across the lie.",
    theme: T(["#FFFFFF", "#FFF9EE", "#FFF1DA"], true, "#6E645C", "#FF2E1F", "#FFFFFF") },
  { id: "testimonies", day: 8, label: "Testimony", ref: "Genesis 4:3–5", title: "Two Offerings", name: "Still moving", what: "The ring rolls to the edge like a wheel and keeps turning, small. Settled open, its centre beats once.",
    theme: T(["#4BE08F", "#1FB868", "#0E8A4C"], false, "#FFF6B0", "#4BE08F", "#06301F") },
  { id: "questions", day: 9, label: "Hard question", ref: "Genesis 4:15", title: "A Mark of Protection", name: "The head tilt", what: "The question mark shrinks to the edge and tilts its head, still asking. Settled open, it wobbles once while it thinks.",
    theme: T(["#4A3624", "#33261C", "#261D17"], false, "#FFC21A", "#FFC21A", "#2A1206") },
  { id: "prayer-nights", day: 10, label: "Prayer night", ref: "Genesis 6:5, 8", title: "Noah Found Favor", name: "Moonset", what: "The moon arcs down the sky, turning as it goes, and the ground deepens. Settled open, three stars come out.",
    theme: T(["#9B5CF0", "#6A2FC0", "#3E1680"], false, "#FFE27A", "#A774F5", "#FFFFFF") },
];

const clamp = v => Math.max(0, Math.min(1, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ramp = (v, a, b) => clamp((v - a) / (b - a));
const STEPS = [true, true, false, false];
const ICONS = [
  '<path d="m5 12.5 4.5 4.5L19 7.5" stroke-width="2.6"/>', '<path d="m5 12.5 4.5 4.5L19 7.5" stroke-width="2.6"/>',
  '<path d="M4 5.5h16v10H10l-4.5 4v-4H4z"/><path d="M10.3 8.6a1.8 1.8 0 1 1 2.4 1.7c-.5.2-.7.6-.7 1.1M12 13.4v.1"/>',
  '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/>'];

/* Each category's gesture: its markup, and how it moves with e (0 slim … 1 open) and m (the settle beat, 0 → 1). */
const ART = {
  "daily-church": {
    html: `<div class="dusk" style="inset:0;background:linear-gradient(200deg,#FF7A1A,#E2400A)"></div>
      <svg class="sun" width="380" height="380" viewBox="0 0 380 380" style="left:0;top:0"><defs><radialGradient id="sf" cx="40%" cy="35%" r="60%"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#FFF6C9"/><stop offset="1" stop-color="#FFE27A"/></radialGradient></defs>
      <circle class="r1" cx="190" cy="190" r="190" fill="#fff" opacity=".12"/><circle class="r2" cx="190" cy="190" r="162" fill="#fff" opacity=".22"/><circle cx="190" cy="190" r="135" fill="url(#sf)"/></svg>`,
    set(a, e, m) {
      a.querySelector(".dusk").style.opacity = .55 * (1 - e);
      // Open: centre (268, 80). Slim: centre (300, 150), smaller, so only the top of the sun clears the edge.
      const cx = lerp(300, 268, e), cy = lerp(104, 80, e) + 18 * (1 - m) * e, sc = lerp(.4, 1, e);
      a.querySelector(".sun").style.transform = `translate(${cx - 190}px, ${cy - 190}px) scale(${sc})`;
      a.querySelector(".r1").setAttribute("r", 190 * lerp(.92, 1, m)); a.querySelector(".r2").setAttribute("r", 162 * lerp(.94, 1, m));
    } },
  "jesus-only": {
    html: `<div class="him" style="right:44px;top:-14px;font-size:132px;line-height:140px;font-weight:900;letter-spacing:-8px;color:#FFFFFF33;transform-origin:right 70%">Him</div>
      <div class="stop" style="width:24px;height:24px;border-radius:12px;background:#FFE27A"></div>`,
    set(a, e, m) {
      const him = a.querySelector(".him");
      him.style.transform = `scaleX(${lerp(.05, 1, e)})`; him.style.opacity = ramp(e, .15, .7);
      const st = a.querySelector(".stop");
      const r = lerp(30, 20, e), t = lerp(40, 98, e), s = 1 + .35 * Math.sin(m * Math.PI) * e;
      st.style.right = r + "px"; st.style.top = t + "px"; st.style.transform = `scale(${s})`;
    } },
  "letters-struggling": {
    html: `<div class="q" style="right:4px;top:-46px;font-size:300px;line-height:320px;font-weight:900;color:#FFB38A;transform-origin:70% 30%">“</div>`,
    set(a, e, m) {
      const lift = Math.sin(m * Math.PI) * 10 * e;
      a.querySelector(".q").style.transform = `translate(${6 * (1 - e)}px, ${22 * (1 - e) - lift}px) rotate(${lerp(-26, -6, e)}deg) scale(${lerp(.4, 1, e)})`;
      a.querySelector(".q").style.opacity = lerp(.75, 1, e);
    } },
  "letters-grateful": {
    html: `<svg class="q" width="150" height="128" viewBox="0 0 150 128" style="left:0;top:0;transform-origin:0 0"><path d="M20 0h44v52c0 40-18 66-52 76l-8-16c18-8 26-22 26-40H20z M86 0h44v52c0 40-18 66-52 76l-8-16c18-8 26-22 26-40H86z" fill="#7A0E33"/></svg>`,
    set(a, e, m, card) {
      // Slim: the quote closes the title, sized to its type. Open: big in the top right.
      const end = card._titleEnd || { x: 200, y: 44 };
      const x = lerp(end.x + 3, 362 - 22 - 150, e), y = lerp(end.y, 26, e), sc = lerp(.11, 1, e) * (1 + .06 * Math.sin(m * Math.PI) * e);
      a.querySelector(".q").style.transform = `translate(${x}px, ${y}px) scale(${sc})`;
    } },
  "character-studies": {
    html: `<div class="ring" style="width:48px;height:48px;border-radius:24px;box-shadow:inset 0 0 0 2px #FFFFFF59;right:24px;top:28px"></div>
      <div class="name" style="right:-10px;top:92px;font-size:100px;line-height:104px;font-weight:900;letter-spacing:-5px;white-space:nowrap;display:flex">
        <span class="ini" style="color:#3A1200;display:inline-block;transform-origin:center"></span><span class="rest" style="color:#FFFFFF42;display:inline-flex"></span></div>`,
    set(a, e, m, card) {
      const who = card._cat.who;
      const ini = a.querySelector(".ini"), rest = a.querySelector(".rest");
      if (!ini.textContent) { ini.textContent = who[0]; rest.innerHTML = [...who.slice(1)].map(c => `<span style="display:inline-block">${c}</span>`).join(""); }
      // The rest of the name slides into the initial; settled open, it types back out letter by letter.
      [...rest.children].forEach((c, i) => {
        const typed = e > .99 ? clamp(m * 1.5 - i * .25) : 1;
        c.style.opacity = ramp(e, .6, .92) * typed;
        c.style.transform = `translateX(${-48 * (1 - e) * (i + 1)}px) scale(${lerp(.6, 1, e)})`;
      });
      // The initial travels from the start of the name to the monogram ring.
      const nameBox = a.querySelector(".name"), w = nameBox.offsetWidth, iw = ini.offsetWidth || 60;
      const openX = 362 + 10 - w + iw / 2, openY = 92 + 52, slimX = 362 - 24 - 24, slimY = 28 + 24;
      const cx = lerp(slimX, openX, e), cy = lerp(slimY, openY, e), sc = lerp(.34, 1, e);
      ini.style.transform = `translate(${cx - openX}px, ${cy - openY}px) scale(${sc})`;
      a.querySelector(".ring").style.opacity = ramp(.4 - e, 0, .3);
    } },
  "deep-verse": {
    html: `<div class="verse" style="width:250px;right:-30px;top:22px;font-size:34px;line-height:34px;font-weight:900;letter-spacing:-1.2px;color:#FFFFFF24"></div>
      <div class="lens" style="width:104px;height:104px;left:0;top:0;transform-origin:center">
        <div style="position:absolute;inset:0;border-radius:52px;border:4px solid #F7F0E6;background:#231B2AD9;overflow:hidden;display:grid;place-items:center"><span class="w" style="font-size:24px;font-weight:900;letter-spacing:-.6px;color:#FFC21A"></span></div>
        <div style="position:absolute;right:-26px;bottom:-14px;width:44px;height:8px;border-radius:4px;background:#F7F0E6;transform:rotate(40deg)"></div></div>`,
    set(a, e, m, card) {
      const c = card._cat, v = a.querySelector(".verse");
      if (!v.textContent) { v.innerHTML = c.verse.replace(c.word, `<span class="kw" style="color:#FFC21A55">${c.word}</span>`); a.querySelector(".w").textContent = c.word; }
      v.style.opacity = ramp(e, .35, .85);
      // Open: the lens reads across the second line and rests on the key word. Slim: small, on the right, still holding the word.
      // Open: the lens reads in from the start of the verse and rests clear of the words, holding the key word.
      const read = e > .99 ? m : 1, ox = lerp(190, 300, read), oy = lerp(40, 64, read);
      const x = lerp(362 - 22 - 26, ox, e), y = lerp(52, oy, e), sc = lerp(.5, .92, e);
      a.querySelector(".lens").style.transform = `translate(${x - 52}px, ${y - 52}px) scale(${sc})`;
    } },
  "misconceptions": {
    html: `<div class="lie" style="right:-6px;top:-12px;font-size:150px;line-height:156px;font-weight:900;letter-spacing:-6px;color:#2A12061F;transform-origin:right center">LIE</div>
      <div class="bar" style="height:12px;border-radius:6px;background:#FF2E1F;transform-origin:left center"></div>`,
    set(a, e, m) {
      a.querySelector(".lie").style.opacity = ramp(e, .2, .7); a.querySelector(".lie").style.transform = `scale(${lerp(.6, 1, e)})`;
      // Open: a long strike across LIE, drawn in when the page settles. Slim: a short red stroke on the right.
      const b = a.querySelector(".bar"), draw = e > .99 ? m : 1;
      const w = lerp(46, 140, e) * draw, left = lerp(362 - 26 - 46, 244, e), top = lerp(48, 64, e), th = lerp(8, 12, e);
      b.style.width = w + "px"; b.style.left = left + "px"; b.style.top = top + "px"; b.style.height = th + "px";
      b.style.transform = `rotate(-12deg)`;
    } },
  "testimonies": {
    html: `<div class="wheel" style="width:220px;height:220px;left:0;top:0;transform-origin:center">
      <svg class="spin" width="220" height="220" viewBox="0 0 220 220" style="position:absolute;inset:0"><defs><path id="rp" d="M110 30a80 80 0 1 1 0 160a80 80 0 1 1 0-160"/></defs><text fill="#FFFFFFD9" font-size="17" font-weight="900" letter-spacing="4"><textPath href="#rp">STILL MOVING · STILL MOVING · STILL MOVING ·</textPath></text></svg>
      <div class="hub" style="position:absolute;left:88px;top:88px;width:44px;height:44px;border-radius:22px;background:#FFE14D"></div></div>`,
    set(a, e, m, card) {
      // Rolls like a wheel: the distance travelled turns it. Its slow spin carries on either way.
      const cx = lerp(362 - 24 - 26, 362 + 40 - 110, e), cy = lerp(52, -30 + 110, e), sc = lerp(.28, 1, e);
      const travel = (1 - e) * 140, spin = (card._t || 0) / 14400 * 360; // the text repeats every 120°, so the loop seam is invisible
      a.querySelector(".wheel").style.transform = `translate(${cx - 110}px, ${cy - 110}px) scale(${sc})`;
      a.querySelector(".spin").style.transform = `rotate(${spin + travel / 80 * 57.3}deg)`;
      a.querySelector(".hub").style.transform = `scale(${1 + .25 * Math.sin(m * Math.PI) * e})`;
    } },
  "questions": {
    html: `<div class="qm" style="right:-14px;top:-40px;font-size:290px;line-height:300px;font-weight:900;letter-spacing:-10px;color:#FFC21A;transform-origin:50% 70%">?</div>`,
    set(a, e, m) {
      const wobble = Math.sin(m * Math.PI * 2) * 7 * (1 - m) * e;
      a.querySelector(".qm").style.transform = `translate(${-4 * (1 - e)}px, ${-100 * (1 - e)}px) rotate(${lerp(14, 0, e) + wobble}deg) scale(${lerp(.3, 1, e)})`;
    } },
  "prayer-nights": {
    html: `<div class="deep" style="inset:0;background:#1A0B3D"></div>
      <svg class="moon" width="200" height="200" viewBox="0 0 200 200" style="left:0;top:0;transform-origin:center"><path d="M100 10 A90 90 0 1 0 100 190 A100 100 0 1 1 100 10Z" fill="#FFF2CC"/></svg>
      <i class="st" style="width:6px;height:6px;border-radius:3px;background:#FFF2CC;left:200px;top:40px"></i><i class="st" style="width:4px;height:4px;border-radius:2px;background:#FFF2CC;left:236px;top:150px"></i><i class="st" style="width:5px;height:5px;border-radius:3px;background:#FFF2CC;left:330px;top:190px"></i>`,
    set(a, e, m) {
      a.querySelector(".deep").style.opacity = .4 * (1 - e);
      // An arc: from the top right, down and in, turning as it sets.
      const t = 1 - e, cx = lerp(362 + 20 - 100, 362 - 22 - 24, t) - Math.sin(t * Math.PI) * 30, cy = lerp(-30 + 100, 52, t), sc = lerp(1, .24, t);
      a.querySelector(".moon").style.transform = `translate(${cx - 100}px, ${cy - 100}px) rotate(${lerp(-24, 50, t)}deg) scale(${sc})`;
      a.querySelectorAll(".st").forEach((s, i) => s.style.opacity = e > .99 ? clamp(m * 2 - i * .4) : 0);
    } },
};

function cardHTML(c) {
  const th = c.theme, [g0, g1, g2] = th.ground, dim = c.id === "questions" || c.id === "deep-verse";
  const toks = STEPS.map((d, i) => `<span class="tok" style="background:${d ? th.accent : th.chip};color:${d ? th.accentInk : th.chipIcon}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d ? ICONS[0] : ICONS[i]}</svg></span>`).join("");
  return `<div class="card" data-cat="${c.id}">
    <div class="ground" style="background:radial-gradient(125% 110% at 88% 0%, ${g0}, ${g1} 45%, ${g2});${dim ? "box-shadow:inset 0 0 0 1.5px #FFC21A47;" : ""}"></div>
    <div class="art" data-art data-bleed>${ART[c.id].html}</div>
    <div class="l meta" style="top:22px"><div class="num" style="color:${th.num}">${String(c.day).padStart(2, "0")}</div><div class="lab" style="color:${th.label}">${c.label} · ${c.ref}</div></div>
    <div class="l kick" style="color:${th.label}">${String(c.day).padStart(2, "0")} · ${c.label} <span class="dots">${STEPS.map(d => `<i class="${d ? "on" : ""}"></i>`).join("")}</span></div>
    <div class="l title" style="color:${th.ink}"><span>${c.title}</span></div>
    <div class="l steps">${toks}<span class="k" style="color:${th.label}">2 of 4</span></div>
  </div>`;
}

/** Long titles shrink to fit two lines (adjustsFontSizeToFit in the app). */
function fitTitle(card) {
  if (card._fit) return; card._fit = true;
  const t = card.querySelector(".title"); let size = 26;
  while (t.scrollHeight > 58 && size > 20) { size -= 1; t.style.fontSize = size + "px"; t.style.lineHeight = (size + 2) + "px"; }
}
/** Lay one card out at openness e and settle beat m. */
function render(card, e, m) {
  fitTitle(card);
  card.style.height = (104 + 120 * e) + "px";
  const title = card.querySelector(".title");
  title.style.top = (42 + 54 * e) + "px"; title.style.transform = `scale(${.77 + .23 * e})`;
  card.querySelector(".meta").style.opacity = ramp(e, .62, .9);
  card.querySelector(".meta").style.transform = `translateY(${-10 * (1 - e)}px)`;
  card.querySelector(".kick").style.opacity = 1 - ramp(e, .25, .45);
  card.querySelector(".steps").style.opacity = ramp(e, .62, .9);
  card.querySelectorAll(".tok").forEach((t, i) => t.style.transform = `translateY(${-14 * (1 - clamp((e > .99 ? m : 1) * 1.6 - i * .2))}px)`);
  // Where the slim title ends (for the grateful quote) and where the key word sits (for the lens).
  const span = title.querySelector("span"), rects = span.getClientRects(), cr = card.getBoundingClientRect();
  if (rects.length) { const r = rects[rects.length - 1]; const k = .77 / (.77 + .23 * e); card._titleEnd = { x: 22 + (r.right - cr.left - 22) * k, y: 42 + (r.top - cr.top - title.offsetTop) * k + 2 }; }
  ART[card._cat.id].set(card.querySelector(".art"), e, m, card);
  const kw = card.querySelector(".kw");
  if (kw) { const r = kw.getBoundingClientRect(); card._kw = { x: r.left - cr.left + r.width / 2, y: r.top - cr.top + r.height / 2 }; }
}

/* The live card: open, fold to slim, hold, open, the beat plays, hold. */
const LOOP = 4800;
function live(t) {
  const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  if (t < 500) return { e: 1, m: 1 };
  if (t < 1400) return { e: 1 - ease((t - 500) / 900), m: 0 };
  if (t < 2500) return { e: 0, m: 0 };
  if (t < 3400) return { e: ease((t - 2500) / 900), m: 0 };
  return { e: 1, m: clamp((t - 3400) / 700) };
}

for (const c of CATS) {
  document.write(`<section class="screen" data-name="${String(c.day).padStart(2, "0")}-${c.id}" data-kind="state" data-chrome="none" data-motion="${LOOP}" data-freeze="4500" data-palette="identity">
    <div class="board"><h2>${c.label} · ${c.name}</h2><p class="what">${c.what}</p>
      <div class="cap">LIVE</div>${cardHTML(c)}
      <div class="cap">HALFWAY</div>${cardHTML(c)}
      <div class="cap">SLIM</div>${cardHTML(c)}</div></section>`);
}

const boards = [...document.querySelectorAll("section.screen")];
