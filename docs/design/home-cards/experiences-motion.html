<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Closer experiences motion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=Shantell+Sans:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="file:///Users/kennyespinal23/.claude/skills/app-designer-pro/assets/device.css">
<style>
.screen { font-family: "Nunito", var(--sf-rounded); }
.page { position: absolute; inset: 0; overflow: hidden; }
.abs { position: absolute; }
.top { position: absolute; left: 20px; right: 20px; top: 62px; height: 48px; display: flex; align-items: center; gap: 14px; z-index: 9; }
.x { width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; flex: none; }
.bars { flex: 1; display: flex; gap: 8px; } .bars i { flex: 1; height: 6px; border-radius: 3px; }
.eyebrow { font-size: 13px; line-height: 17px; font-weight: 800; letter-spacing: 1.1px; text-transform: uppercase; }
.h1 { font-size: 32px; line-height: 36px; font-weight: 900; letter-spacing: -.9px; }
.body { font-size: 17px; line-height: 25px; font-weight: 500; }
.meta { font-size: 15px; line-height: 20px; font-weight: 600; }
.cta { position: absolute; left: 20px; right: 20px; bottom: 50px; height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 17px; font-weight: 800; z-index: 8; }
.paint { background-size: cover; background-position: center; }
.hand { font-family: "Shantell Sans", cursive; font-weight: 700; }
.finger { position: absolute; width: 54px; height: 54px; border-radius: 27px; background: #FFFFFF66; box-shadow: 0 0 0 2px #FFFFFFB3, 0 6px 16px #00000040; z-index: 20; pointer-events: none; }
</style>
</head>
<body>
<script>
/* ── timing helpers ── */
const clamp = v => Math.max(0, Math.min(1, v)), lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const out = x => 1 - Math.pow(1 - x, 3);
const spring = x => x >= 1 ? 1 : 1 - Math.exp(-6 * x) * Math.cos(10 * x);   // a soft spring with one small overshoot
const S = (t, a, b, f = out) => f(seg(t, a, b));
/** A finger: fades in over (x,y), presses at `at`, lifts. */
const finger = (t, at, x, y, x2, y2, dragEnd) => {
  const vis = seg(t, at - .35, at - .15) * (1 - seg(t, (dragEnd ?? at) + .15, (dragEnd ?? at) + .35));
  if (vis <= 0) return "";
  const press = Math.sin(seg(t, at - .1, at + .12) * Math.PI);
  const d = dragEnd ? ease(seg(t, at, dragEnd)) : 0;
  const fx = lerp(x, x2 ?? x, d), fy = lerp(y, y2 ?? y, d);
  return `<div class="finger" style="left:${fx - 27}px;top:${fy - 27}px;opacity:${vis};transform:scale(${1 - .14 * (dragEnd ? (t > at && t < dragEnd ? 1 : press) : press)})"></div>`;
};

const IMG = f => `url(../../../assets/bible-moments/${f}.jpg)`;
const xi = c => `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>`;
const chk = c => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>`;
const arrow = c => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;
const bar = ({ xBg, xInk, on, track, p = .4 }) => `<div class="top"><span class="x" style="background:${xBg}">${xi(xInk)}</span><div class="bars"><i style="background:${on}"></i><i style="background:linear-gradient(90deg,${on} ${p * 100}%,${track} ${p * 100}%)"></i><i style="background:${track}"></i><i style="background:${track}"></i></div></div>`;

const SCREENS = [];
const screen = (name, build, o = {}) => { SCREENS.push({ name, build, freeze: o.freeze ?? 2000 }); document.write(`<section class="screen" data-name="${name}" data-kind="core" data-time="7:42" ${o.chrome ? `data-chrome="${o.chrome}"` : ""} data-palette="identity" data-motion="8000" data-freeze="${o.freeze ?? 2000}"><div class="page"></div></section>`); };
</script>

<!-- 1 · DAILY CHURCH: tap a spot in the scene; it pops gold and the point of the talk springs up. -->
<script>
screen("m01-daily-church", t => {
  // 1.0s tap spot 3 · 1.2–1.9s sheet springs up · 5.6s swipe down · 6.6s spot 2 tapped and found · reset at 7.6s
  const open = S(t, 1.15, 1.9, spring) * (1 - S(t, 5.4, 5.9, ease));
  const hot = (x, y, n, found, active) => {
    const pop = active ? 1 + .25 * Math.sin(seg(t, 1, 1.35) * Math.PI) : 1;
    return `<div class="abs" style="left:${x - 24}px;top:${y - 24}px;width:48px;height:48px;border-radius:24px;display:grid;place-items:center;font-size:17px;font-weight:900;transform:scale(${pop});
    ${found ? "background:#FFC21A;color:#3A1500;box-shadow:0 6px 14px -6px #00000080" : `background:#3A150059;color:#fff;box-shadow:inset 0 0 0 3px #fff,0 0 0 ${8 * Math.sin((t * 1.2) % 1 * Math.PI)}px #FFFFFF33`}">${found ? chk("#3A1500") : n}</div>`;
  };
  const found3 = t > 1.05, found2 = t > 6.7 && t < 7.7;
  const count = 1 + (found3 ? 1 : 0) + (found2 ? 1 : 0);
  return `
  <div class="abs" style="inset:0;background:#FFF8EA"></div>
  ${bar({ xBg: "#F4E6CF", xInk: "#3A1500", on: "#3A1500", track: "#3A150026", p: .3 + .2 * count })}
  <div class="abs" style="left:20px;right:20px;top:122px"><div class="eyebrow" style="color:#8A3B00">Daily Church · Genesis 1:27</div><div class="h1" style="color:#3A1500;margin-top:6px">Made in His Image</div></div>
  <div class="abs paint" style="left:20px;right:20px;top:208px;height:420px;border-radius:28px;background-image:${IMG("creation")};box-shadow:0 18px 30px -18px #3A150099">
    ${hot(250, 92, 1, true)}${hot(120, 300, 2, found2, false)}${hot(272, 248, 3, found3, true)}</div>
  <div class="abs" style="left:20px;right:20px;top:650px;display:flex;align-items:center;gap:12px">
    <div style="display:flex;gap:6px">${[0, 1, 2].map(i => `<i style="width:28px;height:6px;border-radius:3px;background:${i < count ? "#FFC21A" : "#3A150022"}"></i>`).join("")}</div>
    <span class="meta" style="color:#8A3B00">${count} of 3 found</span></div>
  <div class="abs" style="left:0;right:0;bottom:0;height:390px;background:#FFF8EA;border-radius:32px 32px 0 0;box-shadow:0 -14px 30px -12px #3A150059;padding:24px 20px 0;transform:translateY(${(1 - open) * 420}px)">
    <div style="width:40px;height:5px;border-radius:3px;background:#3A150026;margin:-10px auto 16px"></div>
    <div class="eyebrow" style="color:#B5400A">2 of 3 · The two in the boats</div>
    <div style="font-size:26px;line-height:30px;font-weight:900;color:#3A1500;margin-top:8px;letter-spacing:-.5px">Made on purpose</div>
    <p class="body" style="color:#3A1500;margin:10px 0 0;opacity:${S(t, 1.5, 1.9)}">Every other thing in the story is called good. People are the only ones made to look like Him.</p>
    <div style="margin-top:14px;padding:14px 16px;border-radius:18px;background:#FFE9B0;color:#5A2A00;font-size:17px;line-height:24px;font-weight:800;opacity:${S(t, 1.65, 2.05)};transform:translateY(${(1 - S(t, 1.65, 2.05)) * 10}px)">“So God created mankind in his own image.”</div>
  </div>
  ${finger(t, 1.0, 292, 456)}${finger(t, 5.4, 201, 560, 201, 760, 5.85)}${finger(t, 6.6, 140, 508)}`;
}, { freeze: 2400 });
</script>

<!-- 2 · JESUS ONLY: swipe, and the camera walks deeper into the painting; His words cross-fade at each stop. -->
<script>
const words = [["Work it and take care of it.", "Genesis 2:15"], ["You are free to eat from any tree in the garden.", "Genesis 2:16"], ["But you must not eat from the tree of the knowledge of good and evil.", "Genesis 2:17"]];
screen("m02-jesus-only", t => {
  // walk 1: 1.2–2.6s · walk 2: 3.8–5.2s · rest · 7.0–7.8s drift back to the start
  const w = S(t, 1.2, 2.6, ease) + S(t, 3.8, 5.2, ease) - 2 * S(t, 7.0, 7.8, ease);
  const stop = Math.round(w);
  const zoom = lerp(1.12, 1.55, w / 2), ox = lerp(50, 38, w / 2), oy = lerp(55, 30, w / 2);
  const near = 1 - Math.min(1, Math.abs(w - stop) * 2.2);   // words fade out mid-walk and back in on arrival
  return `
  <div class="abs paint" style="inset:0;background-image:${IMG("fall")};transform:scale(${zoom});transform-origin:${ox}% ${oy}%"></div>
  <div class="abs" style="inset:0;background:linear-gradient(180deg,#12060AE6 0%,#12060AB3 52%,#12060A00 66%,#12060A33 78%,#12060AE6 100%)"></div>
  ${bar({ xBg: "#FFFFFF26", xInk: "#FFFFFF", on: "#FFFFFF", track: "#FFFFFF40", p: .3 + .3 * w })}
  <div class="abs" style="left:24px;right:24px;top:170px;opacity:${near};transform:translateY(${(1 - near) * 14}px)">
    <div class="eyebrow" style="color:#FFE27A">Jesus Only · Stop ${stop + 1} of 3</div>
    <div style="margin-top:14px;font-size:32px;line-height:38px;font-weight:900;letter-spacing:-.8px;color:#FFFFFF;text-shadow:0 2px 18px #00000066">“${words[stop][0]}”</div>
    <div class="meta" style="color:#FFFFFFCC;margin-top:12px">The LORD God · ${words[stop][1]}</div></div>
  <div class="abs" style="left:28px;right:28px;bottom:84px">
    <div style="position:relative;height:28px">
      <div style="position:absolute;left:0;right:0;top:13px;height:2px;background:#FFFFFF4D"></div>
      <div style="position:absolute;left:0;width:${w * 50}%;top:13px;height:2px;background:#FFFFFF"></div>
      ${[0, 50, 100].map((l, i) => `<span style="position:absolute;left:calc(${l}% - 10px);top:4px;width:20px;height:20px;border-radius:10px;background:${i <= w + .01 ? "#FFFFFF" : "#FFFFFF40"};box-shadow:0 0 0 ${i === stop ? 5 * near : 0}px #FFFFFF40"></span>`).join("")}</div>
    <div style="display:flex;justify-content:space-between;margin-top:10px;font-size:13px;font-weight:800;color:#FFFFFFB3"><span>The work</span><span>The freedom</span><span>The tree</span></div></div>
  ${finger(t, 1.15, 320, 600, 90, 600, 1.6)}${finger(t, 3.75, 320, 600, 90, 600, 4.2)}`;
}, { chrome: "light", freeze: 6000 });
</script>

<!-- 3 · A STRUGGLING LETTER: lines arrive after a typing pause; tap a reply, it slides into the thread; the verse arrives as its own bubble. -->
<script>
const bub = (t, show, text, me, extra = "") => show <= 0 ? "" : `<div style="align-self:${me ? "flex-end" : "flex-start"};max-width:78%;padding:12px 16px;border-radius:22px;${me ? "border-bottom-right-radius:6px;background:#FFFFFF;color:#0B3A28" : "border-bottom-left-radius:6px;background:#FFF4E6;color:#22332B"};font-size:17px;line-height:23px;font-weight:600;opacity:${show};transform:translateY(${(1 - show) * 14}px) scale(${.92 + .08 * show});transform-origin:${me ? "right" : "left"} bottom;${extra}">${text}</div>`;
const typing = (on) => on ? `<div style="align-self:flex-start;padding:14px 18px;border-radius:22px;background:#FFF4E6;display:flex;gap:5px">${[0, 1, 2].map(i => `<i style="width:8px;height:8px;border-radius:4px;background:#5F7A6C;opacity:${.3 + .7 * Math.abs(Math.sin((performance.now() / 300) + i))}"></i>`).join("")}</div>` : "";
screen("m03-struggling", t => {
  // 0.2 typing · 0.7 line 1 · 1.3 typing · 1.8 line 2 · 2.3 choices · 3.3 tap · 3.5 reply · 4.1 typing · 4.6 line 3 · 5.3 verse · 7.6 fade
  const fade = 1 - S(t, 7.5, 7.9);
  const choices = S(t, 2.3, 2.7) * (1 - S(t, 3.35, 3.6));
  const typingOn = (t > .2 && t < .7) || (t > 1.3 && t < 1.8) || (t > 4.1 && t < 4.6) || (t > 4.8 && t < 5.3);
  return `
  <div class="abs" style="inset:0;background:radial-gradient(120% 70% at 85% 0%,#1E7A52,#0E4D33 50%,#08301F)"></div>
  ${bar({ xBg: "#FFFFFF26", xInk: "#FFFFFF", on: "#FFFFFF", track: "#FFFFFF40", p: .2 + .4 * seg(t, .5, 5.5) })}
  <div class="abs" style="left:20px;right:20px;top:118px;display:flex;align-items:center;gap:12px">
    <span style="width:40px;height:40px;border-radius:20px;background:#FFB38A;display:grid;place-items:center;font-size:22px;font-weight:900;color:#5A2410">“</span>
    <div><div style="font-size:17px;font-weight:800;color:#fff">A letter for a hard day</div><div style="font-size:13px;color:#BFE3CF">Written ahead of time, a few lines at a time</div></div></div>
  <div class="abs" style="left:16px;right:16px;top:186px;display:flex;flex-direction:column;gap:8px;opacity:${fade}">
    ${bub(t, S(t, .7, 1), "Some days you feel like the only one who doesn’t fit anywhere.")}
    ${bub(t, S(t, 1.8, 2.1), "Adam knew that feeling. He named every animal, and none of them was like him.")}
    ${bub(t, S(t, 3.45, 3.8, spring), "That’s me lately.", true)}
    ${bub(t, S(t, 4.6, 4.9), "Then hear this first: God noticed before Adam said a word.")}
    ${S(t, 5.3, 5.7) > 0 ? `<div style="align-self:flex-start;max-width:84%;padding:16px;border-radius:22px;border-bottom-left-radius:6px;background:#FFE0C9;color:#5A2410;opacity:${S(t, 5.3, 5.7)};transform:translateY(${(1 - S(t, 5.3, 5.7, spring)) * 18}px) scale(${.9 + .1 * S(t, 5.3, 5.7, spring)});transform-origin:left bottom"><div style="font-size:13px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#8A4A2A">Genesis 2:18</div><div style="font-size:19px;line-height:25px;font-weight:800;margin-top:6px">“It is not good for the man to be alone.”</div></div>` : ""}
    ${typing(typingOn)}
  </div>
  ${choices > 0 ? `<div class="abs" style="left:16px;right:16px;bottom:118px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;opacity:${choices};transform:translateY(${(1 - choices) * 24}px)">
    <div style="font-size:13px;font-weight:800;color:#BFE3CF;margin-bottom:2px">Choose a reply</div>
    ${["That’s me lately.", "Not really, but go on.", "Why did God wait to fix it?"].map((x, i) => `<div style="padding:12px 18px;border-radius:22px;background:${i === 0 && t > 3.25 ? "#FFFFFF59" : "#FFFFFF1F"};box-shadow:inset 0 0 0 1.5px #FFFFFF59;color:#fff;font-size:17px;font-weight:700">${x}</div>`).join("")}</div>` : ""}
  <div class="abs" style="left:0;right:0;bottom:50px;display:flex;justify-content:center"><div style="display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:20px;background:#00000033;color:#DDF2E6;font-size:15px;font-weight:700">If you’re not okay today</div></div>
  ${finger(t, 3.3, 300, 618)}`;
}, { chrome: "light", freeze: 6200 });
</script>

<!-- 4 · A GRATEFUL LETTER: tap a snapshot; it lifts, flies to the centre and flips to the thank-you on its back. -->
<script>
const snapFace = (img, w, back, note) => `<div style="position:absolute;inset:0;backface-visibility:hidden;padding:${w * .06}px ${w * .06}px ${w * .2}px;background:${back ? "#FFFDF7" : "#FFFFFF"};box-shadow:0 14px 24px -14px #5A0A2499,0 1px 2px #5A0A2433;${back ? "transform:rotateY(180deg)" : ""}">
  ${back ? `<div style="height:${w * .88}px;display:flex;align-items:center;padding:6px"><div class="hand" style="font-size:${w * .085}px;line-height:1.25;color:#7A0E33">${note}</div></div>` : `<div class="paint" style="height:${w * .88}px;background-image:${IMG(img)}"></div>`}</div>`;
const snap = (img, x, y, r, w, flip = 0, note = "", z = 1, opacity = 1) => `<div class="abs" style="left:${x}px;top:${y}px;width:${w}px;height:${w * 1.14}px;transform:perspective(1000px) rotate(${r}deg) rotateY(${flip * 180}deg);transform-style:preserve-3d;z-index:${z};opacity:${opacity}">${snapFace(img, w)}${snapFace(img, w, true, note)}</div>`;
screen("m04-grateful", t => {
  // 1.0s tap · 1.1–1.9 lift and fly to centre while flipping · hold · 6.2–7.0 back to its place · reset
  const go = S(t, 1.1, 1.9, ease) * (1 - S(t, 6.2, 7.0, ease));
  const flip = S(t, 1.3, 2.0, ease) * (1 - S(t, 6.1, 6.8, ease));
  const x = lerp(212, 51, go), y = lerp(468, 260, go), w = lerp(170, 300, go), r = lerp(-5, -2, go);
  const lift = Math.sin(go * Math.PI) * 18;
  return `
  <div class="abs" style="inset:0;background:#FFE7EE"></div>
  ${bar({ xBg: "#FFFFFFB3", xInk: "#3A0716", on: "#B0124A", track: "#3A071626", p: .4 + .3 * go })}
  <div class="abs" style="left:20px;right:20px;top:122px"><div class="eyebrow" style="color:#6E0B2C">A grateful letter · Day 4</div><div class="h1" style="color:#3A0716;margin-top:6px">Turn them over</div></div>
  <div class="abs" style="inset:0;opacity:${1 - .65 * go}">
    ${snap("never-leave", 24, 214, -7, 170)}${snap("god-peace", 206, 230, 6, 170, 1, "Bread still warm at the door this morning.")}${snap("with-you-always", 34, 452, 4, 170)}</div>
  ${snap("come-to-me", x, y - lift, r, w, flip, "The neighbour who fixed our gate in the rain and wouldn’t take a penny for it.", 5)}
  <div class="abs" style="left:20px;right:20px;bottom:120px;display:flex;align-items:center;justify-content:space-between;opacity:${1 - go}"><span class="meta" style="color:#8A3A55">${t > 1.9 && t < 6.5 ? 3 : 2} of 5 turned over</span><span style="font-size:15px;font-weight:800;color:#B0124A">Tap a photo to turn it</span></div>
  <div class="abs" style="left:20px;right:20px;top:640px;text-align:center;opacity:${S(t, 2.0, 2.4) * (1 - S(t, 5.9, 6.2))}"><div class="meta" style="color:#8A3A55">Small, and still from Him.</div></div>
  ${finger(t, 1.0, 296, 560)}`;
}, { freeze: 3200 });
</script>

<!-- 5 · CHARACTER STUDY: tap the last panel; the page turns and a key moment fills the page; its caption bubble pops. -->
<script>
const cap = (t, x, y, w) => `<div class="abs" style="left:${x}px;top:${y}px;max-width:${w}px;padding:6px 10px;background:#FFF6D6;color:#2A1000;font-size:14px;line-height:18px;font-weight:800;box-shadow:2px 2px 0 #2A1000">${t}</div>`;
const pageA = (o = 1) => `<div class="abs" style="left:14px;right:14px;top:170px;height:600px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:300px 1fr;gap:10px;opacity:${o}">
  <div class="paint" style="grid-column:1/3;position:relative;background-image:${IMG("fall")};border:4px solid #2A1000;border-radius:6px">${cap("The fruit is eaten. Their eyes are opened.", 10, 10, 230)}</div>
  <div class="paint" style="position:relative;background-image:${IMG("covering-shame")};border:4px solid #2A1000;border-radius:6px">${cap("They hide among the trees.", 8, 8, 150)}</div>
  <div style="position:relative;background:#2A1000;border:4px solid #2A1000;border-radius:6px;display:flex;align-items:center;justify-content:center;padding:12px"><div style="font-size:34px;line-height:36px;font-weight:900;color:#FFF6D6;text-align:center;transform:rotate(-3deg)">“WHERE ARE YOU?”</div>
    <div class="abs" style="right:10px;bottom:10px;width:34px;height:34px;border-radius:17px;background:#E2500A;display:grid;place-items:center">${arrow("#fff")}</div></div></div>`;
screen("m05-character", t => {
  // panels arrive one by one 0.2–1.2 · tap 2.2 · page turn 2.3–3.1 · caption pops 3.3 · hold · 6.8–7.6 back
  const turn = S(t, 2.3, 3.1, ease) * (1 - S(t, 6.8, 7.6, ease));
  const panelIn = i => S(t, .2 + i * .3, .6 + i * .3, spring);
  const pop = S(t, 3.2, 3.6, spring) * (1 - S(t, 6.6, 6.9));
  return `
  <div class="abs" style="inset:0;background:#F6EBDD"></div>
  ${bar({ xBg: "#EADBC8", xInk: "#2A1000", on: "#E2500A", track: "#2A100022", p: .45 + .3 * turn })}
  <div class="abs" style="left:20px;right:20px;top:118px;display:flex;align-items:baseline;justify-content:space-between"><div style="font-size:30px;font-weight:900;letter-spacing:-1px;color:#E2500A">ADAM</div><div class="meta" style="color:#7A5A44">Page ${turn > .5 ? 3 : 2} of 4</div></div>
  <div class="abs" style="inset:0">
    ${turn < .5 ? pageA() : ""}
    ${turn < .5 ? "" : `<div class="abs paint" style="left:14px;right:14px;top:170px;height:560px;background-image:${IMG("first-promise")};border:4px solid #2A1000;border-radius:6px;transform:perspective(1400px) rotateY(${(1 - turn) * 90}deg);transform-origin:left center">
      ${cap("Genesis 3:15", 12, 12, 200)}
      <div class="abs" style="left:18px;right:18px;bottom:18px;padding:14px 16px;background:#FFFFFF;border:3px solid #2A1000;border-radius:22px;font-size:19px;line-height:25px;font-weight:900;color:#2A1000;transform:scale(${pop});transform-origin:30% 100%;opacity:${clamp(pop * 2)}">Before they leave the garden, God plants a promise.</div></div>`}
