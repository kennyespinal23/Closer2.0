<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Closer letters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=Shantell+Sans:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="file:///Users/kennyespinal23/.claude/skills/app-designer-pro/assets/device.css">
<script src="days.js"></script>
<style>
.screen { font-family: "Nunito", var(--sf-rounded); }
.page { position: absolute; inset: 0; overflow: hidden; }
.abs { position: absolute; }
.top { position: absolute; left: 20px; right: 20px; top: 62px; height: 48px; display: flex; align-items: center; gap: 14px; z-index: 9; }
.x { width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; flex: none; }
.bars { flex: 1; display: flex; gap: 8px; } .bars i { flex: 1; height: 6px; border-radius: 3px; }
.eyebrow { font-size: 13px; line-height: 17px; font-weight: 800; letter-spacing: 1.1px; text-transform: uppercase; }
.paint { background-size: cover; background-position: center; }
.hand { font-family: "Shantell Sans", cursive; font-weight: 700; }
.finger { position: absolute; width: 54px; height: 54px; border-radius: 27px; background: #FFFFFF66; box-shadow: 0 0 0 2px #FFFFFFB3, 0 6px 16px #00000040; z-index: 20; }
.cap { position: absolute; left: 24px; right: 24px; text-align: center; }
.cap .t { font-size: 28px; line-height: 33px; font-weight: 900; letter-spacing: -.7px; }
.cap .s { font-size: 15px; line-height: 21px; font-weight: 700; margin-top: 8px; }
</style>
</head>
<body>
<script>
const clamp = v => Math.max(0, Math.min(1, v)), lerp = (a, b, t) => a + (b - a) * t, seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2, out = x => 1 - Math.pow(1 - x, 3);
const spring = x => x >= 1 ? 1 : 1 - Math.exp(-6 * x) * Math.cos(10 * x);
const S = (t, a, b, f = out) => f(seg(t, a, b));
const IMG = f => `url(../../../assets/bible-moments/${f}.jpg)`;
const xi = c => `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>`;
const bar = (c, track, p) => `<div class="top"><span class="x" style="background:${track}">${xi(c)}</span><div class="bars"><i style="background:linear-gradient(90deg,${c} ${p * 100}%,${track} ${p * 100}%)"></i><i style="background:${track}"></i><i style="background:${track}"></i></div></div>`;
const finger = (t, at, x, y) => { const v = seg(t, at - .35, at - .15) * (1 - seg(t, at + .15, at + .35)); if (v <= 0) return ""; const p = Math.sin(seg(t, at - .1, at + .12) * Math.PI); return `<div class="finger" style="left:${x - 27}px;top:${y - 27}px;opacity:${v};transform:scale(${1 - .14 * p})"></div>`; };
/* One loop: rest 0–1.0 · tap 1.0 · open 1.05–2.25 · the experience lands 2.0–2.6 · hold · fade back 5.4–6.0 */
const TAP = 1.0, LOOP = 6000;
const phase = t => ({ open: S(t, 1.05, 2.25, ease) * (1 - S(t, 5.4, 6.0)), land: S(t, 2.0, 2.6) * (1 - S(t, 5.3, 5.7)), rest: 1 - S(t, 1.05, 1.4) + S(t, 5.6, 6.0) });
const SCREENS = [];
const screen = (name, build, freeze = 1700) => { SCREENS.push({ build, freeze }); document.write(`<section class="screen" data-name="${name}" data-kind="state" data-time="7:42" data-chrome="light" data-palette="identity" data-motion="${LOOP}" data-freeze="${freeze}"><div class="page"></div></section>`); };
const D = n => window.DAYS[n - 1];
/** The caption under every object: what it is, and what to do. */
const caption = (title, sub, color, sub2, rest, y = 640) => `<div class="cap" style="top:${y}px;opacity:${rest}"><div class="t" style="color:${color}">${title}</div><div class="s" style="color:${sub2}">${sub}</div></div>`;
</script>

<!-- 1 · DAILY CHURCH: the order of service. A folded bulletin with the sun on its cover; tap and it opens out in three panels, and the talk begins. -->
<script>
screen("l01-daily-church", t => {
  const { open, land, rest } = phase(t), d = D(1);
  const fold = open;   // the two outer panels swing open from the middle
  return `<div class="abs" style="inset:0;background:radial-gradient(120% 80% at 80% 0%,#FFE45C,#FFC21A 45%,#FF9F0A)"></div>
  ${bar("#3A1500", "#3A150026", land * .1)}
  <div class="abs" style="left:${lerp(101, 20, fold)}px;top:${lerp(210, 160, fold)}px;width:${lerp(200, 362, fold)}px;height:${lerp(300, 420, fold)}px;perspective:1200px;opacity:${1 - land}">
    <div class="abs" style="inset:0;background:#FFF8EA;border-radius:6px;box-shadow:0 30px 40px -24px #6A2B10AA;padding:${lerp(18, 26, fold)}px">
      <div class="eyebrow" style="color:#B5400A;font-size:11px">Order of service · Day ${d.day}</div>
      <div style="margin-top:10px;font-size:${lerp(15, 26, fold)}px;line-height:1.15;font-weight:900;color:#3A1500">1 · The reading<br><span style="font-weight:700;font-size:.75em;color:#7A4A1A">${d.reference}</span></div>
      <div style="margin-top:14px;font-size:${lerp(15, 26, fold)}px;line-height:1.15;font-weight:900;color:#3A1500">2 · The message</div>
      <div style="margin-top:14px;font-size:${lerp(15, 26, fold)}px;line-height:1.15;font-weight:900;color:#3A1500">3 · Take home</div></div>
    <div class="abs" style="left:0;top:0;width:50%;height:100%;transform-origin:left center;transform:rotateY(${-170 * fold}deg);backface-visibility:hidden;border-radius:6px 0 0 6px;overflow:hidden;background:#FFF1D0;box-shadow:inset -10px 0 20px -10px #6A2B1040"></div>
    <div class="abs" style="left:50%;top:0;width:50%;height:100%;transform-origin:right center;transform:rotateY(${170 * fold}deg);backface-visibility:hidden;border-radius:0 6px 6px 0;overflow:hidden">
      <div class="abs" style="inset:0;left:-100%;background:#FFF8EA">
        <svg width="400" height="400" viewBox="0 0 400 400" style="position:absolute;left:30%;top:-30%"><circle cx="200" cy="200" r="150" fill="#FFE27A"/><circle cx="200" cy="200" r="190" fill="#FFC21A" opacity=".25"/></svg>
        <div class="abs" style="left:52%;bottom:24px;right:14px;font-size:22px;line-height:25px;font-weight:900;color:#3A1500">${d.title}</div></div></div>
  </div>
  ${caption("Daily Church", "Today’s order of service. Tap to open it.", "#3A1500", "#6A2B10", rest)}
  <div class="abs" style="inset:0;opacity:${land}"><div class="abs" style="inset:0;background:#FFF8EA"></div>
    <div class="abs" style="left:20px;top:122px"><div class="eyebrow" style="color:#8A3B00">Daily Church · ${d.reference}</div><div style="font-size:32px;font-weight:900;color:#3A1500;margin-top:6px;letter-spacing:-.9px">${d.title}</div></div>
    <div class="abs paint" style="left:20px;right:20px;top:208px;height:420px;border-radius:28px;background-image:${IMG("creation")};transform:scale(${lerp(.94, 1, land)})"></div>${bar("#3A1500", "#3A150026", .05)}</div>
  ${finger(t, TAP, 201, 360)}`;
});
</script>

<!-- 2 · JESUS ONLY: a red envelope sealed with a gold full stop. Tap: the seal splits, the letter rises out in red ink, and the walk begins. -->
<script>
screen("l02-jesus-only", t => {
  const { open, land, rest } = phase(t), d = D(2);
  const seal = S(t, 1.05, 1.35), flap = S(t, 1.25, 1.75, ease), rise = S(t, 1.6, 2.25, ease);
  return `<div class="abs" style="inset:0;background:radial-gradient(120% 80% at 80% 0%,#FF5A4E,#E0233A 45%,#A80F2A)"></div>
  <div class="abs" style="right:-20px;top:90px;font-size:150px;line-height:150px;font-weight:900;letter-spacing:-9px;color:#FFFFFF1F">Him</div>
  <div class="abs" style="left:61px;top:${lerp(330, 380, rise)}px;width:280px;opacity:${1 - land}">
    <div class="abs" style="left:14px;right:14px;top:${lerp(20, -170, rise)}px;height:200px;background:#FFF7F2;border-radius:4px;padding:18px;box-shadow:0 10px 20px -12px #00000080">
      <div class="eyebrow" style="color:#C21A33;font-size:11px">${d.reference}</div><div style="margin-top:10px;font-size:20px;line-height:26px;font-weight:900;color:#D11A36">“Work it and take care of it.”</div></div>
    <div style="position:relative;width:280px;height:190px;background:#C21A33;border-radius:8px;box-shadow:0 30px 40px -24px #5A0010CC">
      <div class="abs" style="left:0;right:0;top:0;height:120px;transform-origin:top;transform:perspective(800px) rotateX(${180 * flap}deg);clip-path:polygon(0 0,100% 0,50% 100%);background:#A8132A;z-index:${flap > .5 ? 0 : 2}"></div>
      <div class="abs" style="left:116px;top:94px;width:48px;height:48px;z-index:3">
        <div class="abs" style="left:0;top:0;width:24px;height:48px;overflow:hidden;transform:translateX(${-14 * seal}px) rotate(${-25 * seal}deg);opacity:${1 - seg(t, 1.4, 1.7)}"><div style="width:48px;height:48px;border-radius:24px;background:#FFC21A;box-shadow:inset 0 -4px 0 #D99A00"></div></div>
        <div class="abs" style="left:24px;top:0;width:24px;height:48px;overflow:hidden;transform:translateX(${14 * seal}px) rotate(${25 * seal}deg);opacity:${1 - seg(t, 1.4, 1.7)}"><div style="width:48px;height:48px;border-radius:24px;background:#FFC21A;margin-left:-24px;box-shadow:inset 0 -4px 0 #D99A00"></div></div></div>
    </div></div>
  ${caption("Jesus Only", "Sealed with His words. Tap the seal.", "#FFFFFF", "#FFE7E2", rest, 600)}
  <div class="abs" style="inset:0;opacity:${land}"><div class="abs paint" style="inset:0;background-image:${IMG("fall")};transform:scale(${lerp(1.3, 1.12, land)})"></div>
    <div class="abs" style="inset:0;background:linear-gradient(180deg,#12060AE6,#12060AB3 52%,#12060A00 66%,#12060AE6)"></div>
    <div class="abs" style="left:24px;right:24px;top:170px"><div class="eyebrow" style="color:#FFE27A">Jesus Only · Stop 1 of 3</div><div style="margin-top:14px;font-size:32px;line-height:38px;font-weight:900;color:#fff;letter-spacing:-.8px">“Work it and take care of it.”</div></div>${bar("#FFFFFF", "#FFFFFF40", .05)}</div>
  ${finger(t, TAP, 201, 448)}`;
});
</script>

<!-- 3 · A STRUGGLING LETTER: a note folded in thirds, slipped under a door. Tap: it slides into the light and unfolds; the first lines arrive as messages. -->
<script>
screen("l03-struggling", t => {
  const { open, land, rest } = phase(t);
  const slide = S(t, 1.05, 1.5, ease), unfold = S(t, 1.45, 2.2, ease);
  return `<div class="abs" style="inset:0;background:#0B3A28"></div>
  <div class="abs" style="left:0;right:0;top:0;height:470px;background:linear-gradient(180deg,#1E7A52,#13563A)"></div>
  <div class="abs" style="left:46px;right:46px;top:120px;height:350px;border-radius:10px 10px 0 0;background:linear-gradient(180deg,#0E4D33,#0B3A28);box-shadow:inset 0 0 0 6px #0A3324"><div class="abs" style="right:26px;top:170px;width:16px;height:16px;border-radius:8px;background:#C9A24A"></div></div>
  <div class="abs" style="left:0;right:0;top:466px;height:8px;background:#FFE7A066;filter:blur(6px)"></div>
  <div class="abs" style="left:${lerp(110, 41, unfold)}px;top:${lerp(lerp(452, 500, slide), 220, unfold)}px;width:${lerp(180, 320, unfold)}px;opacity:${1 - land};transform:rotate(${lerp(-4, 0, unfold)}deg);perspective:900px">
    <div style="background:#FFFBF2;border-radius:4px;padding:${lerp(14, 22, unfold)}px;box-shadow:0 20px 30px -16px #000000AA;height:${lerp(110, 330, unfold)}px;overflow:hidden;background-image:repeating-linear-gradient(180deg,transparent 0 ${lerp(10, 31, unfold)}px,#CFE3D8 ${lerp(10, 31, unfold)}px ${lerp(11, 32, unfold)}px)">
      <div class="hand" style="font-size:${lerp(16, 30, unfold)}px;color:#0A6B47">${unfold > .4 ? "Dear friend," : "for a hard day"}</div>
      <div style="margin-top:12px;font-size:16px;line-height:31px;font-weight:600;color:#22332B;opacity:${seg(unfold, .6, 1)}">Some days you feel like the only one who doesn’t fit anywhere.</div></div>
    ${[1, 2].map(i => `<div class="abs" style="left:0;right:0;top:${i * 33.3}%;height:1px;background:#0000001A;opacity:${1 - unfold}"></div>`).join("")}
  </div>
  ${caption("A letter for a hard day", "Someone slipped it under the door. Tap to read it.", "#FFFFFF", "#BFE3CF", rest, 620)}
  <div class="abs" style="inset:0;opacity:${land}"><div class="abs" style="inset:0;background:radial-gradient(120% 70% at 85% 0%,#1E7A52,#0E4D33 50%,#08301F)"></div>
    <div class="abs" style="left:16px;top:190px;max-width:300px;padding:12px 16px;border-radius:22px;border-bottom-left-radius:6px;background:#FFF4E6;color:#22332B;font-size:17px;line-height:23px;font-weight:600;transform:translateY(${(1 - land) * 14}px)">Some days you feel like the only one who doesn’t fit anywhere.</div>${bar("#FFFFFF", "#FFFFFF40", .05)}</div>
  ${finger(t, TAP, 200, 474)}`;
}, 1500);
</script>

<!-- 4 · A GRATEFUL LETTER: a pink card envelope with a polaroid peeking out. Tap: the polaroid slides out, spins and lands, and the journal opens around it. -->
<script>
screen("l04-grateful", t => {
  const { open, land, rest } = phase(t);
  const out1 = S(t, 1.05, 1.6, ease), drop = S(t, 1.5, 2.2, spring);
  return `<div class="abs" style="inset:0;background:radial-gradient(120% 80% at 80% 0%,#FFB3C6,#FF7A9E 45%,#F24F7F)"></div>
  <div class="abs" style="left:61px;top:${lerp(360, 470, out1)}px;width:280px;height:190px;opacity:${(1 - land) * (1 - seg(t, 1.6, 2.0))}">
    <div class="abs paint" style="left:70px;top:${lerp(-60, -140, out1)}px;width:140px;height:150px;background:#fff;padding:8px 8px 26px;box-shadow:0 10px 18px -10px #00000080;transform:rotate(${lerp(-4, -10, out1)}deg)"><div class="paint" style="height:100%;background-image:${IMG("come-to-me")}"></div></div>
    <div class="abs" style="inset:0;background:#FFE7EE;border-radius:8px;box-shadow:0 30px 40px -24px #7A0E33AA;clip-path:polygon(0 30%,50% 62%,100% 30%,100% 100%,0 100%)"></div>
    <div class="abs" style="left:0;right:0;top:0;height:120px;clip-path:polygon(0 0,50% 100%,100% 0);background:#FFD3DF;transform-origin:top;transform:perspective(700px) rotateX(${150 * out1}deg);z-index:-1"></div>
    <div class="abs hand" style="left:0;right:0;bottom:18px;text-align:center;font-size:18px;color:#B0124A">for you, with thanks</div></div>
  <div class="abs paint" style="left:${lerp(131, 46, drop)}px;top:${lerp(240, 262, drop)}px;width:${lerp(140, 310, drop)}px;height:${lerp(150, 350, drop)}px;background:#fff;padding:12px 12px 44px;box-shadow:0 18px 26px -14px #5A0A2499;transform:rotate(${lerp(-10, -2, drop) + 180 * clamp(drop)}deg);opacity:${seg(t, 1.55, 1.7) * (1 - land)}">
    <div style="height:100%;background:#FFFDF7;display:flex;align-items:center;padding:14px;transform:rotate(180deg)"><div class="hand" style="font-size:22px;line-height:1.3;color:#7A0E33">The neighbour who fixed our gate in the rain.</div></div></div>
  ${caption("A grateful letter", "There’s a photo inside. Tap to take it out.", "#3A0716", "#5A0A24", rest, 620)}
  <div class="abs" style="inset:0;opacity:${land}"><div class="abs" style="inset:0;background:#FFE7EE"></div>
    <div class="abs" style="left:20px;top:122px"><div class="eyebrow" style="color:#6E0B2C">A grateful letter · Day 4</div><div style="font-size:32px;font-weight:900;color:#3A0716;margin-top:6px">Turn them over</div></div>
    ${[["never-leave", 24, 214, -7], ["god-peace", 206, 230, 6], ["with-you-always", 34, 452, 4], ["come-to-me", 212, 468, -5]].map(([f, x, y, r], i) => `<div class="abs" style="left:${x}px;top:${y + (1 - land) * 30 * (i + 1)}px;width:170px;height:194px;background:#fff;padding:10px 10px 34px;transform:rotate(${r}deg);box-shadow:0 14px 24px -14px #5A0A2499"><div class="paint" style="height:100%;background-image:${IMG(f)}"></div></div>`).join("")}${bar("#B0124A", "#3A071626", .05)}</div>
  ${finger(t, TAP, 201, 300)}`;
});
</script>

<!-- 5 · CHARACTER STUDY: a comic book, issue number on the cover. Tap: the cover swings open like a book and the first page fills the screen. -->
<script>
screen("l05-character", t => {
  const { open, land, rest } = phase(t), d = D(5);
  const cover = S(t, 1.05, 1.9, ease), grow = S(t, 1.7, 2.3, ease);
  return `<div class="abs" style="inset:0;background:#F6EBDD"></div>
  <div class="abs" style="inset:0;background-image:radial-gradient(#2A10001A 1.2px,transparent 1.2px);background-size:8px 8px"></div>
  <div class="abs" style="left:${lerp(91, 14, grow)}px;top:${lerp(170, 170, grow)}px;width:${lerp(220, 374, grow)}px;height:${lerp(320, 600, grow)}px;perspective:1400px;opacity:${1 - land}">
    <div class="abs" style="inset:0;border:4px solid #2A1000;background:#fff;display:grid;grid-template-rows:1.3fr 1fr;gap:6px;padding:6px">
      <div class="paint" style="background-image:${IMG("fall")};border:3px solid #2A1000"></div><div class="paint" style="background-image:${IMG("covering-shame")};border:3px solid #2A1000"></div></div>
    <div class="abs" style="inset:0;transform-origin:left center;transform:rotateY(${-160 * cover}deg);backface-visibility:hidden;background:#E2500A;border:4px solid #2A1000;box-shadow:${8 - 20 * cover}px 8px 0 #2A1000;overflow:hidden">
      <div class="abs" style="left:10px;top:10px;padding:4px 8px;background:#FFE680;border:2px solid #2A1000;font-size:12px;font-weight:900;color:#2A1000">ISSUE ${String(d.day).padStart(2, "0")}</div>
      <div class="abs" style="left:-4px;right:0;top:44px;font-size:62px;line-height:60px;font-weight:900;letter-spacing:-3px;color:#FFE680;text-shadow:4px 4px 0 #2A1000">ADAM</div>
      <div class="abs paint" style="left:14px;right:14px;top:120px;bottom:60px;background-image:${IMG("first-promise")};border:3px solid #2A1000"></div>
      <div class="abs" style="left:14px;right:14px;bottom:14px;font-size:15px;font-weight:900;color:#2A1000;background:#fff;padding:6px 8px;border:2px solid #2A1000">${d.title}</div></div>
  </div>
  ${caption("Character study", "This week’s issue. Tap to open it.", "#2A1000", "#7A5A44", rest, 660)}
  <div class="abs" style="inset:0;opacity:${land}"><div class="abs" style="inset:0;background:#F6EBDD"></div>
    <div class="abs" style="left:20px;top:118px;font-size:30px;font-weight:900;letter-spacing:-1px;color:#E2500A">ADAM</div>
    <div class="abs" style="left:14px;right:14px;top:170px;height:600px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:300px 1fr;gap:10px">
      <div class="paint" style="grid-column:1/3;background-image:${IMG("fall")};border:4px solid #2A1000;border-radius:6px"></div><div class="paint" style="background-image:${IMG("covering-shame")};border:4px solid #2A1000;border-radius:6px"></div><div style="background:#2A1000;border-radius:6px;display:grid;place-items:center;color:#FFF6D6;font-size:30px;font-weight:900;text-align:center">“WHERE ARE YOU?”</div></div>${bar("#E2500A", "#2A100022", .05)}</div>
  ${finger(t, TAP, 230, 400)}`;
});
</script>

<!-- 6 · DEEP VERSE: one index card in a wooden catalogue drawer. Tap: the drawer slides out, the card lifts and turns to face you, becoming the page on the desk. -->
<script>
screen("l06-deep-verse", t => {
  const { open, land, rest } = phase(t), d = D(6);
  const drawer = S(t, 1.05, 1.5, ease), lift = S(t, 1.45, 2.25, ease);
  return `<div class="abs" style="inset:0;background:linear-gradient(160deg,#6B4426,#4A2E18 60%,#3A2312)"></div>
  <div class="abs" style="inset:0;background:repeating-linear-gradient(95deg,#FFFFFF05 0 2px,transparent 2px 9px)"></div>
  <div class="abs" style="left:76px;top:${lerp(380, 430, drawer)}px;width:250px;height:150px;opacity:${(1 - land) * (1 - seg(t, 1.9, 2.3))}">
    <div class="abs" style="left:0;right:0;top:0;height:150px;background:linear-gradient(180deg,#8A5A34,#6A4226);border-radius:6px;box-shadow:0 24px 30px -16px #000000CC,inset 0 0 0 3px #A0703F"></div>
    <div class="abs" style="left:95px;top:100px;width:60px;height:22px;border-radius:4px;background:#C9A24A;box-shadow:inset 0 0 0 2px #8A6A2A"></div>
    <div class="abs" style="left:100px;top:78px;width:50px;height:16px;background:#FFFBF2;font-size:9px;font-weight:900;text-align:center;line-height:16px;color:#5A4030">3:15</div></div>
